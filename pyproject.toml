[project]
name = "codegraph-rag"
version = "0.1.0"
description = "Local-first GraphRAG tool that parses Python codebases into a Neo4j knowledge graph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "neo4j>=5.28.0,<6.0",
    "python-dotenv>=1.0.0,<2.0",
    "tree-sitter>=0.23.0,<0.24",
    "tree-sitter-python>=0.23.0,<0.24",
    "uvicorn[standard]>=0.48.0",
]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
